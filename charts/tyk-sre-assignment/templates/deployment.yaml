apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tyk-sre-assignment.fullname" . }}
  labels:
    {{- include "tyk-sre-assignment.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tyk-sre-assignment.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "tyk-sre-assignment.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tyk-sre-assignment.serviceAccountName" . }}
      containers:
        - name: tyk-sre-assignment
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
